[project]
name = "grayswan-scraper"
version = "0.1.0"
description = "Scrape submissions from Gray Swan Arena"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.0",
    "rich>=13.0",
    "rookiepy>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
grayswan-scrape = "src.main:main"
